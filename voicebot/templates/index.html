<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishika AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text">Rishika AI</span>
                </div>
            </div>
            <div class="sidebar-content">
                <button class="new-chat-btn" onclick="clearChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Conversation
                </button>
                <div class="sidebar-info">
                    <div class="info-card">
                        <div class="info-label">Model</div>
                        <div class="info-value">GPT-4o Mini</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Personality</div>
                        <div class="info-value">Rishika Bhandari</div>
                    </div>
                </div>
            </div>
            <div class="sidebar-footer">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-chat">
            <!-- Top Bar -->
            <header class="chat-header">
                <div class="header-avatar">
                    <div class="avatar-circle">R</div>
                </div>
                <div class="header-info">
                    <h1 class="header-name">Rishika Bhandari</h1>
                    <p class="header-status">AI Assistant</p>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="clearChat()" title="Clear chat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div class="chat-messages" id="chatBox">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">✦</div>
                    <h2>Rishika Bhandari</h2>
                    <p>MBA Business Analytics · IIT Dhanbad</p>
                    <p class="welcome-sub">Ask me anything — I'm here to have a powerful conversation.</p>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <div class="typing-avatar">R</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <div class="input-wrapper">
                    <button class="input-action mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice input">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"></path>
                            <path d="M19 10v2a7 7 0 01-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <textarea
                        id="message"
                        class="chat-input"
                        placeholder="Ask something powerful..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="input-action send-btn" id="sendBtn" onclick="sendMessage()" title="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
            </div>
        </main>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const micBtn = document.getElementById('micBtn');

        let isListening = false;
        let recognition = null;

        // --- Auto-resize textarea ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // --- Handle Enter / Shift+Enter ---
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // --- Hide welcome screen ---
        function hideWelcome() {
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }
        }

        // --- Append a message bubble ---
        function appendMessage(text, className) {
            hideWelcome();

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper ' + className;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (className === 'bot') {
                const avatar = document.createElement('div');
                avatar.className = 'bubble-avatar';
                avatar.textContent = 'R';
                wrapper.appendChild(avatar);
            }

            bubble.textContent = text;
            wrapper.appendChild(bubble);

            // Timestamp
            const time = document.createElement('div');
            time.className = 'message-time';
            const now = new Date();
            time.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            wrapper.appendChild(time);

            chatBox.appendChild(wrapper);
            scrollToBottom();
        }

        // --- Show typing dots ---
        function showTyping() {
            hideWelcome();
            typingIndicator.style.display = 'flex';
            scrollToBottom();
        }

        // --- Hide typing dots ---
        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        // --- Scroll to bottom ---
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- Send message ---
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';
            showTyping();

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(res => res.json())
            .then(data => {
                hideTyping();
                appendMessage(data.reply, 'bot');

                // TTS
                const speech = new SpeechSynthesisUtterance(data.reply);
                speech.rate = 1;
                speech.pitch = 1;
                speechSynthesis.speak(speech);
            })
            .catch(() => {
                hideTyping();
                appendMessage('Sorry, something went wrong. Please try again.', 'bot');
            });
        }

        // --- Voice input ---
        function toggleVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Speech recognition is not supported in your browser.');
                return;
            }

            if (isListening) {
                if (recognition) recognition.stop();
                micBtn.classList.remove('listening');
                isListening = false;
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.continuous = false;

            micBtn.classList.add('listening');
            isListening = true;

            recognition.onresult = function(event) {
                messageInput.value = event.results[0][0].transcript;
                autoResize(messageInput);
                micBtn.classList.remove('listening');
                isListening = false;
            };

            recognition.onerror = function() {
                micBtn.classList.remove('listening');
                isListening = false;
            };

            recognition.onend = function() {
                micBtn.classList.remove('listening');
                isListening = false;
            };

            recognition.start();
        }

        // --- Clear chat ---
        function clearChat() {
            const messages = chatBox.querySelectorAll('.message-wrapper');
            messages.forEach(m => m.remove());
            if (welcomeScreen) {
                welcomeScreen.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
