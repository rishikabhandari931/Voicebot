<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rishika AI ✨</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0f172a, #1e2937); font-family: system-ui; }
        .chat-box { scrollbar-width: thin; scrollbar-color: #64748b #334155; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 20px; margin-bottom: 12px; animation: fadeIn 0.3s; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-2xl bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-600 to-pink-600 p-5 text-white flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center text-2xl">✨</div>
        <div>
            <h1 class="text-2xl font-bold">Rishika AI</h1>
            <p class="text-xs opacity-75">Always ready to help</p>
        </div>
    </div>

    <!-- Chat -->
    <div id="chatBox" class="chat-box h-[60vh] overflow-y-auto p-6 bg-slate-950 flex flex-col"></div>

    <!-- Input -->
    <div class="p-5 bg-slate-900 border-t border-slate-700">
        <div class="flex gap-3">
            <input type="text" id="message" 
                   class="flex-1 bg-slate-800 text-white rounded-2xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-purple-500 placeholder-slate-400"
                   placeholder="Ask something powerful...">
            <button onclick="startListening()" 
                    class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-2xl flex items-center justify-center text-2xl transition">🎤</button>
            <button onclick="sendMessage()" 
                    class="w-12 h-12 bg-purple-600 hover:bg-purple-500 rounded-2xl flex items-center justify-center text-2xl transition">➤</button>
        </div>
    </div>
</div>

<script>
function appendMessage(text, className) {
    const chatBox = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = `message ${className}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function showLoader() {
    const chatBox = document.getElementById("chatBox");
    const loader = document.createElement("div");
    loader.className = "loader self-start text-slate-400 text-sm flex items-center gap-2";
    loader.id = "loader";
    loader.innerHTML = `<span class="animate-pulse">Rishika is thinking</span>`;
    chatBox.appendChild(loader);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeLoader() {
    const loader = document.getElementById("loader");
    if (loader) loader.remove();
}

function sendMessage() {
    const input = document.getElementById("message");
    const message = input.value.trim();
    if (!message) return;
    
    appendMessage(message, "user");
    input.value = "";
    showLoader();

    fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message })
    })
    .then(r => r.json())
    .then(data => {
        removeLoader();
        appendMessage(data.reply, "bot");
        const speech = new SpeechSynthesisUtterance(data.reply);
        speech.rate = 1.05; speech.pitch = 1;
        speechSynthesis.speak(speech);
    })
    .catch(() => {
        removeLoader();
        appendMessage("Sorry, something went wrong.", "bot");
    });
}

function startListening() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.onresult = e => {
        document.getElementById("message").value = e.results[0][0].transcript;
    };
    recognition.start();
}
</script>
</body>
</html>
